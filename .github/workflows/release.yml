name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set keystore path
        run: echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$SIGNING_STORE_FILE"
      - name: Verify tag matches app version
        run: |
          version_name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v${version_name}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName \"$version_name\" in app/build.gradle.kts. Bump the version, commit, and tag again."
            exit 1
          fi
          IFS=. read -r x y z <<< "$version_name"
          # Minor and patch must stay below 100, or two versions would pack into the same versionCode.
          if ! [[ "$x" =~ ^(0|[1-9][0-9]*)$ && "$y" =~ ^(0|[1-9][0-9]?)$ && "$z" =~ ^(0|[1-9][0-9]?)$ ]]; then
            echo "::error::versionName $version_name must be x.y.z with no leading zeros and y and z between 0 and 99."
            exit 1
          fi
          expected=$((x * 10000 + y * 100 + z))
          if [ "$version_code" != "$expected" ]; then
            echo "::error::versionCode $version_code does not match $expected (x*10000+y*100+z) for versionName $version_name."
            exit 1
          fi
      - name: Test and assemble
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "sms-forwarder-${GITHUB_REF_NAME}.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "sms-forwarder-${GITHUB_REF_NAME}.apk" --generate-notes
      - name: Remove keystore
        if: always()
        run: rm -f "$SIGNING_STORE_FILE"
